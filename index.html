<!DOCTYPE html>
<html>
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>GPA Checker</title>
    <link rel="stylesheet" href="styles.css">
</head>
<body>
    <header>
        
    </header>  
    <h1>GPA Calculator </h1>
    <div id="main">
        <label for="courseName">Course Name:</label>
        <input type="text" id="courseName" name="courseName" placeholder="Course Name">
        <label for="courseCredits">Course Credits:</label>
        <input type="number" id="courseCredits" name="courseCredits" placeholder="Course Credits">
        <label for="grade">Grade</label>
        <select id="grade" name="grade">
            <option value="" disabled selected>-- Select a Grade --</option>
            <option value="A+">A+</option>
            <option value="A">A</option>
            <option value="B+">B+</option>
            <option value="B">B</option>
            <option value="C+">C+</option>
            <option value="C">C</option>
            <option value="D+">D+</option>
            <option value="D">D</option>
            <option value="E">E</option>
        </select>
        
        <button id="addCourseButton">Add Course</button>
        
        <div id="courseDetails"></div>
        
        <div id="gpa"></div>
    </div>
    <footer>
        <a href="https://github.com/KekeliIsHere" class="logo" target="_blank">
            <img src="logos/github-mark-white.png">
        </a>        
        <p>@2026 KekeliIsHere</p>
        <a href="https://www.linkedin.com/in/kekeli-agblobi/" class="logo" target="_blank">>
            <img src="logos/InBug-White.png" >
        </a>
    </footer>
    <script src="main.js"></script>
</body>   
    
</html>
