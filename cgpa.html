<!DOCTYPE html>
<html>
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>ASHESI GPA Calculator</title>
    <link rel="stylesheet" href="styles.css">
    <script src="sidebar.js"></script>
</head>
<body>
    <header>
        <span onclick="openNav()"><img src="logos/three-dot.png" class="logo"></span>        
    </header>
    <div id="mySidenav" class="sidenav">
        <a href="javascript:void(0)" class="closebtn" onclick="closeNav()">&times;</a>
            <a href="index.html" class="nav-btn">Dashboard</a>
            <a href="gpa.html" class="nav-btn">General GPA</a>
            <a href="ashesi-gpa.html" class="nav-btn">Ashesi GPA</a>
            <a href="cgpa.html" class="nav-btn active">Cummulative GPA</a>    
    </div>
    <h1>Cumulative GPA Calculator</h1>
    <div id="main">
        <label for="semesterName">Semester Name:</label>
        <input type="text" id="semesterName" name="semesterName" placeholder="e.g., Fall 2023, Spring 2024">
        
        <label for="semesterGPA">Semester GPA (0.0-4.0):</label>
        <input type="number" id="semesterGPA" name="semesterGPA" placeholder="Enter GPA" step="0.01" min="0" max="4.0">
        
        <label for="semesterCredits">Total Credits This Semester:</label>
        <input type="number" id="semesterCredits" name="semesterCredits" placeholder="Enter total credits" step="0.5" min="0">
        
        <button id="addSemesterButton">Add Semester</button>
        
        <div id="semesterDetails"></div>
        
        <div id="cgpa"></div>
    </div>
    <footer>
        <a href="https://github.com/KekeliIsHere" class="logo" target="_blank">
            <img src="logos/github-mark-white.png">
        </a>        
        <p>@2026 KekeliIsHere</p>
        <a href="https://www.linkedin.com/in/kekeli-agblobi/" class="logo" target="_blank">
            <img src="logos/InBug-White.png" >
        </a>
    </footer>
    <script src="cgpa.js"></script>
    
</body>
